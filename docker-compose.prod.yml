x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ============================================================================
  # 1. Telemetry & Distributed Tracing
  # ============================================================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: nexora-zipkin
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - nexora-net

  # ============================================================================
  # 2. Database, Graph, Cache & Messaging Middleware
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: nexora-kafka
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - nexora-net

  neo4j:
    image: neo4j:5.15-community
    container_name: nexora-neo4j
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/12345678}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    networks:
      - nexora-net

  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-backlog 511 --timeout 300
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexora-net

  # ============================================================================
  # 3. Discovery & Config Infrastructure
  # ============================================================================
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: nexora-discovery-server
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    environment:
      - SERVER_PORT=8761
      - EUREKA_INSTANCE_HOSTNAME=discovery-server
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - nexora-net

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: nexora-config-server
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CONFIG_PORT:-8888}:8888"
    volumes:
      - ./config-repo:/app/config-repo:ro
    environment:
      - SERVER_PORT=8888
      - SPRING_PROFILES_ACTIVE=native
      - CONFIG_SEARCH_LOCATIONS=file:///app/config-repo
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=config-server
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - nexora-net

  # ============================================================================
  # 4. Domain Microservices
  # ============================================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: nexora-user-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${USER_SERVICE_PORT:-9020}:9020"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - SERVER_PORT=9020
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=user-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-nexora-media-mumbai}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-1800000}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}
      - DB_URL=${USER_DB_URL}
      - DB_USERNAME=${USER_DB_USERNAME}
      - DB_PASSWORD=${USER_DB_PASSWORD}
      - JAVA_OPTS=-Xms128m -Xmx384m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9020/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - nexora-net

  posts-service:
    build:
      context: ./posts-service
      dockerfile: Dockerfile
    container_name: nexora-posts-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${POSTS_SERVICE_PORT:-9010}:9010"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - SERVER_PORT=9010
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=posts-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-nexora-media-mumbai}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN}
      - POSTGRES_URL=${POSTS_DB_URL}
      - POSTGRES_USERNAME=${POSTS_DB_USERNAME}
      - POSTGRES_PASSWORD=${POSTS_DB_PASSWORD}
      - JAVA_OPTS=-Xms128m -Xmx384m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9010/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - nexora-net

  connection-service:
    build:
      context: ./connection-service
      dockerfile: Dockerfile
    container_name: nexora-connection-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CONNECTION_SERVICE_PORT:-8090}:8090"
    environment:
      - SERVER_PORT=8090
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=connection-service
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - nexora-net

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: nexora-notification-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-9030}:9030"
    environment:
      - SERVER_PORT=9030
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=notification-service
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - POSTGRES_URL=${NOTIF_DB_URL}
      - POSTGRES_USERNAME=${NOTIF_DB_USERNAME}
      - POSTGRES_PASSWORD=${NOTIF_DB_PASSWORD}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9030/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - nexora-net

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: nexora-chat-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CHAT_SERVICE_PORT:-9040}:9040"
    environment:
      - SERVER_PORT=9040
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=chat-service
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - POSTGRES_URL=${CHAT_DB_URL}
      - POSTGRES_USERNAME=${CHAT_DB_USERNAME}
      - POSTGRES_PASSWORD=${CHAT_DB_PASSWORD}
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9040/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - nexora-net

  # ============================================================================
  # 5. API Gateway
  # ============================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: nexora-api-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=api-gateway
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ZIPKIN_URL=http://zipkin:9411/api/v2/spans
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JAVA_OPTS=-Xms128m -Xmx384m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexora-net

  # ============================================================================
  # 6. Web Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexora-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - nexora-net

networks:
  nexora-net:
    driver: bridge

volumes:
  kafka_data:
  neo4j_data:
  redis_data:
