name: Nexora CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # 1. Frontend Quality Check & Build
  # ============================================================================
  frontend-ci:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Type Check & Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ============================================================================
  # 2. Backend Microservices Compilation & Unit Testing
  # ============================================================================
  backend-ci:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - user-service
          - posts-service
          - connection-service
          - notification-service
          - chat-service
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build & Package ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn clean package -DskipTests

  # ============================================================================
  # 3. Docker Compose Orchestration Validation
  # ============================================================================
  docker-validation:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    needs: [ frontend-ci, backend-ci ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate docker-compose.prod.yml syntax
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: nexora-frontend:test

  # ============================================================================
  # 4. Optional Cloud Deployment (Runs on push to main if SSH secrets configured)
  # ============================================================================
  deploy:
    name: Deploy to Cloud VPS
    runs-on: ubuntu-latest
    needs: [ docker-validation ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Cloud Deployment
        run: |
          echo "CI checks passed successfully."
          echo "To activate automated continuous deployment to your cloud server, add SSH secrets (SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY) to your GitHub repository settings."
