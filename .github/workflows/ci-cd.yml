name: Nexora CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Docker Compose Configuration Validation
  # ============================================================================
  docker-validation:
    name: Validate Docker Configuration
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate docker-compose.prod.yml syntax
        run: |
          docker compose -f docker-compose.prod.yml config --quiet

  # ============================================================================
  # 2. Continuous Deployment to AWS EC2 (Zero-Touch CD)
  # ============================================================================
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [ docker-validation ]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy Containers on EC2
        run: |
          echo "🚀 Starting Automated Deployment on EC2..."
          cd ~/nexora
          git pull origin main
          
          echo "🔨 Building and launching updated containers..."
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          
          echo "⏳ Waiting 30 seconds for microservices to bootstrap and register with Eureka..."
          sleep 30
          
          echo "🧪 Running Automated Post-Deployment Verification Test Suite..."
          python3 e2e_test_suite.py \
            --base-url http://localhost:8080 \
            --user1-email "${{ secrets.TEST_USER_EMAIL || 'guptaabhinav250@gmail.com' }}" \
            --user1-password "${{ secrets.TEST_USER_PASSWORD || 'Test@123' }}" \
            --user2-email "guptaabhinav697@gmail.com" \
            --user2-password "Test@123" \
            --html e2e_report.html
          
          echo "✅ Deployment & Verification Completed Successfully!"

