apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: linkedin-microservices
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              name: http
          env:
            - name: SERVER_PORT
              value: "8888"
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: EUREKA_SERVER_URL
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "config-server"
            - name: CONFIG_GIT_URI
              value: "https://github.com/abhinavgupta/linkedin-config-repo.git"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: linkedin-microservices
spec:
  type: ClusterIP
  selector:
    app: config-server
  ports:
    - name: http
      port: 8888
      targetPort: 8888
