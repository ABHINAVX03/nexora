apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: linkedin-microservices
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9030
              name: http
          env:
            - name: SERVER_PORT
              value: "9030"
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: CONFIG_SERVER_URL
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: EUREKA_SERVER_URL
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "notification-service"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: POSTGRES_NOTIF_DB_URL
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: POSTGRES_NOTIF_DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: POSTGRES_NOTIF_DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: ZIPKIN_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: ZIPKIN_URL
            - name: LOGSTASH_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: LOGSTASH_HOST
            - name: LOGSTASH_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: LOGSTASH_PORT
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9030
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9030
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: linkedin-microservices
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 9030
      targetPort: 9030
