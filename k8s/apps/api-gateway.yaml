apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: linkedin-microservices
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: CONFIG_SERVER_URL
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: EUREKA_SERVER_URL
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "api-gateway"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: JWT_SECRET_KEY
            - name: ZIPKIN_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: ZIPKIN_URL
            - name: LOGSTASH_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: LOGSTASH_HOST
            - name: LOGSTASH_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: LOGSTASH_PORT
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: linkedin-microservices
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
