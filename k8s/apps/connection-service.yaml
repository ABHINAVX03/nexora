apiVersion: apps/v1
kind: Deployment
metadata:
  name: connection-service
  namespace: linkedin-microservices
  labels:
    app: connection-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: connection-service
  template:
    metadata:
      labels:
        app: connection-service
    spec:
      containers:
        - name: connection-service
          image: connection-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: SERVER_PORT
              value: "8090"
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: CONFIG_SERVER_URL
            - name: EUREKA_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: EUREKA_SERVER_URL
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "connection-service"
            - name: NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: NEO4J_URI
            - name: NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: NEO4J_USERNAME
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkedin-secrets
                  key: NEO4J_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: ZIPKIN_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: ZIPKIN_URL
            - name: LOGSTASH_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: LOGSTASH_HOST
            - name: LOGSTASH_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkedin-shared-config
                  key: LOGSTASH_PORT
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: connection-service
  namespace: linkedin-microservices
spec:
  type: ClusterIP
  selector:
    app: connection-service
  ports:
    - name: http
      port: 8090
      targetPort: 8090
