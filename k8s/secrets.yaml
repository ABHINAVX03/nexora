  POSTGRES_USER_DB_URL: "CHANGE_ME"
  POSTGRES_USER_DB_USERNAME: "CHANGE_ME"
  POSTGRES_USER_DB_PASSWORD: "CHANGE_ME"
  POSTGRES_POSTS_DB_URL: "CHANGE_ME"
  POSTGRES_POSTS_DB_USERNAME: "CHANGE_ME"
  POSTGRES_POSTS_DB_PASSWORD: "CHANGE_ME"
  POSTGRES_NOTIF_DB_URL: "CHANGE_ME"
  POSTGRES_NOTIF_DB_USERNAME: "CHANGE_ME"
  POSTGRES_NOTIF_DB_PASSWORD: "CHANGE_ME"
  NEO4J_URI: "CHANGE_ME"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "CHANGE_ME"
