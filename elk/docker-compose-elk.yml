services:
  # ==========================================
  # Zipkin Distributed Tracing Backend
  # ==========================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: linkedin-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - linkedin-net

  # ==========================================
  # Elasticsearch: Log & Search Engine
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: linkedin-elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - linkedin-net

  # ==========================================
  # Logstash: Log Processing & Ingestion
  # ==========================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: linkedin-logstash
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "50000:5000/tcp"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    networks:
      - linkedin-net

  # ==========================================
  # Kibana: Log Dashboard & Visualization
  # ==========================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: linkedin-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - linkedin-net

networks:
  linkedin-net:
    driver: bridge
