    <style>
      #nexora-preloader {
        position: fixed;
        inset: 0;
        display: flex;

      .dark #nexora-preloader {

      .pre-glow {
        position: absolute;
        width: 250px;
        height: 250px;

        background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);

        justify-content: center;
        box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.4);
        position: relative;
        z-index: 2;
      }
      .pre-bar {
        width: 160px;
        height: 3px;
        background: #18181c;
        border-radius: 999px;
        margin-top: 24px;
        overflow: hidden;
        position: relative;
        z-index: 2;
      }
      .pre-bar-inner {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        background: linear-gradient(90deg, transparent, #6366f1, transparent);
        animation: preShimmer 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes prePulse {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.9; }
      }
      @keyframes preShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
