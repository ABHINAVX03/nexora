<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='nexGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23nexGrad)'/%3E%3Cpath d='M9 23V9l14 14V9' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Nexora — Connect. Build. Grow. The next-generation professional network." />
    <title>Nexora — Professional Network</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #nexora-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fafafc;
        color: #09090b;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        z-index: 99999;
      }
      .dark #nexora-preloader {
        background-color: #09090b;
        color: #f4f4f5;
      }
      .pre-glow {
        position: absolute;
        width: 250px;
        height: 250px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
        border-radius: 50%;
        filter: blur(40px);
        animation: prePulse 2s infinite alternate;
      }
      .pre-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.4);
        position: relative;
        z-index: 2;
      }
      .pre-bar {
        width: 160px;
        height: 3px;
        background: #18181c;
        border-radius: 999px;
        margin-top: 24px;
        overflow: hidden;
        position: relative;
        z-index: 2;
      }
      .pre-bar-inner {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        background: linear-gradient(90deg, transparent, #6366f1, transparent);
        animation: preShimmer 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes prePulse {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.9; }
      }
      @keyframes preShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-dark-text antialiased selection:bg-brand-500/20 selection:text-brand-600 transition-colors duration-200">
    <div id="root">
      <div id="nexora-preloader">
        <div class="pre-glow"></div>
        <div class="pre-logo">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 19V5l12 14V5" />
          </svg>
        </div>
        <div class="pre-bar">
          <div class="pre-bar-inner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
